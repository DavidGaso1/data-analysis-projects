name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  data-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run data-integrity validation
        run: python3 scripts/validate_data.py
